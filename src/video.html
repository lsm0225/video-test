<!doctype html>
<html lang="ko">
<head>

<style>

  #tag{z-index:200}

  .ov{position:absolute;inset:0;pointer-events:none}

  #flash{background:#fff;opacity:0}
  #dark{background:#000;opacity:0}
  /* 자막 */

  .sub.title{bottom:150px}

  .sub.copy{bottom:120px}

  .sub.slogan{bottom:auto;top:680px}
  .sub.slogan .m{font-family:"Noto Serif CJK KR",serif;font-weight:900;font-size:112px;line-height:1.28;letter-spacing:.01em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
  .sub.slogan .m small{display:block;font-size:64px;font-weight:600;letter-spacing:.12em;margin-bottom:10px}
  /* 컷 표시 태그 */
  #tag{position:absolute;z-index:200;left:56px;top:46px;display:flex;gap:10px;align-items:center;font-family:Inter,"Noto Sans CJK KR",sans-serif;font-size:21px;color:#fff}

  .emb i::after{content:"";position:absolute;left:13px;top:11px;width:16px;height:22px;border:solid #fff;border-width:0 5px 5px 0;transform:rotate(40deg) scale(.7)}
  /* C-11 키워드 */

  /* C-12 시설 라벨 */
  .lab{position:absolute;transform:translate(-50%,-50%) scale(0);padding:10px 22px;border-radius:999px;background:#fff;color:#1d2a5b;font-weight:800;font-size:34px;box-shadow:0 8px 26px rgba(0,0,0,.4)}
  /* C-34 로고 자리 */
  #logo{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1d2a5b}

  C28:{img:28, shot:"WS", k:[[0,1.24,.38,.55,0],[1,1.06,.6,.5,0]], tin:{fade:.5}},
  C29a:{img:29, shot:"CU 시리즈", label:"C-29", k:[[0,1.06,.7,.42,0],[1,1.16,.7,.4,0]]},
  C29b:{img:18, shot:"CU 시리즈", label:"C-29", k:[[0,1.95,.44,.4,0],[1,2.1,.44,.38,0]]},

  C34:{logo:true, shot:"로고"},
};
// 스토리보드 자막
const SUBS = [
  {a:"C01",b:"C01",m:"정상을 향한 조준",cls:"title",at:1.0},
  {a:"C02",b:"C02",m:"흔들림 없는 집중",cls:"title",at:.6},
  {a:"C03",b:"C03",m:"선배의 꿈이 후배에게 닿는다",cls:"title",at:.7},
  {a:"C04",b:"C04",m:"정상을 향한 조준, 성문에서 당신의 변화가 시작되다",cls:"copy",at:1.6},
  {a:"C05",b:"C05",m:"안양을 담은 조망, 몰입을 위한 시그니처 공간",s:"100석 규모 개방형 스터디 카페"},
  {a:"C06",b:"C06",m:"교실의 경계를 넘어 꿈을 설계하는 창의적 배움터",s:"대학 강의실형 세미나실 · 개방형 교실"},
  {a:"C07",b:"C07",m:"함께하는 3년의 여정, 1:1 맞춤형 케어의 완성",s:"단계별 심화 학습반 · 전담 교사 밀착 관리"},
  {a:"C09",b:"C09",m:"검증된 환경, 미래를 선도하는 200억 교육사업 선정",s:"AI·디지털 활용 교육 · 국제교육협력사업 · 경기예술365+ · 미래형 과학실 등"},
  {a:"C11",b:"C11",m:"스스로 설계하는 내일, 선택의 기회",s:"선택 중심 교육과정"},
  {a:"C12",b:"C12",m:"배움이 머무는 모든 공간"},
  {a:"C15",b:"C15",m:"국가대표급 에너지, 땀방울로 증명하는 투지",at:1.55},
  {a:"C16",b:"C16",m:"생각의 깊이가 실력이 되는 시간",s:"인문·독서 동아리"},

  {a:"C22",b:"C22",m:"정성이 담긴 식사, 가족처럼 따뜻한 성문 공동체",s:"자체 급식 · 사회적협동조합 매점"},
  {a:"C24a",b:"C24c",m:"사랑과 섬김의 요람, 인성이 실력이 되는 순간",s:"채플 · 버스킹 · 예체능 동아리"},
  {a:"C26",b:"C26",m:"함께 만든 결실, 합격의 환희로 증명하는 성과",s:"최상위권 대입 실적",at:1.05},

  {a:"C31",b:"C31",html:"<small>정상을 향한 조준,</small>성문에서 정점이 되다",cls:"slogan",at:2.3,rise:1.2},
];

const W=1920,H=1080, $=(s)=>document.querySelector(s);
const cutById={}; TL.cuts.forEach((c,i)=>{c.i=i;c.end=c.start+c.dur;cutById[c.id]=c;});
const anims=[];
function A(el,kf,start,dur,easing){ // 절대 시간 기준 애니메이션 등록
  const a=el.animate(kf,{duration:Math.max(1,dur*1000),delay:start*1000,fill:"both",easing:easing||"cubic-bezier(.2,.7,.2,1)"}); a.pause(); anims.push(a); return a;
}
const ease={io:t=>.5-.5*Math.cos(Math.PI*t), out:t=>1-Math.pow(1-t,3), in:t=>t*t*t, lin:t=>t};
function camAt(k,p){
  if(p<=k[0][0]) return k[0]; if(p>=k[k.length-1][0]) return k[k.length-1];
  for(let i=1;i<k.length;i++) if(p<=k[i][0]){const a=k[i-1],b=k[i],u=ease[b[5]||"io"]((p-a[0])/(b[0]-a[0])); return [p,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u,a[3]+(b[3]-a[3])*u,a[4]+(b[4]-a[4])*u];}
}
function lastBeat(t){let lo=0,hi=TL.beats.length-1,r=-9;while(lo<=hi){const m=(lo+hi)>>1; if(TL.beats[m]<=t){r=TL.beats[m];lo=m+1}else hi=m-1} return r;}

// --- 컷 DOM 구성
const imgs=[];
TL.cuts.forEach(c=>{
  const sp=SPEC[c.id], d=document.createElement("div"); d.className="cut"; d.style.zIndex=c.i+1; c.el=d; c.sp=sp;
  if(sp.logo){ d.innerHTML='<div id="logo"><div class="n">성문고등학교</div><div class="l"></div><div class="p">로고 자리 · 학교 CI 수령 후 교체</div></div>'; }
  else{
    const r=document.createElement("div"); r.className="rot"; const im=new Image(); im.className="bg"; im.src=REF+"/c"+String(sp.img).padStart(2,"0")+".jpg"; imgs.push(im); r.appendChild(im); d.appendChild(r); c.rot=r; c.im=im;
    if(sp.tint){const t=document.createElement("div");t.className="ov";t.style.background=sp.tint;t.style.mixBlendMode="screen";d.appendChild(t);}
    if(sp.door){ ["l","r"].forEach(s=>{const p=document.createElement("div");p.className="door "+s;d.appendChild(p);
      A(p,[{transform:"translateX(0)"},{transform:"translateX("+(s=="l"?"-104%":"104%")+")"}],c.start+c.dur*.4,c.dur*.32,"cubic-bezier(.6,0,.2,1)");}); }
  }
  $("#cuts").appendChild(d);
});

// --- 자막
SUBS.forEach(s=>{
  const a=cutById[s.a], b=cutById[s.b], el=document.createElement("div"); el.className="sub "+(s.cls||"");
  el.innerHTML='<div class="m">'+(s.html||s.m)+'</div>'+(s.s?'<div class="s">'+s.s+'</div>':'');
  $("#subs").appendChild(el);
  const na=TL.na.find(n=>n.start>=a.start-0.01 && n.start<a.end); let t0=a.start+(s.at!==undefined?s.at:(na?na.start-a.start-.15:.4)); const t1=b.end-.22, rise=s.rise||.42;
  A(el,[{opacity:0,transform:"translateY(16px)"},{opacity:1,transform:"translateY(0)"}],t0,rise);
  const o=el.animate([{opacity:1},{opacity:0}],{duration:200,delay:t1*1000,fill:"forwards",composite:"replace"}); o.pause(); anims.push(o); s.t0=t0; s.t1=t1; s.el=el;
});

// --- C-09 엠블럼: 태블릿 주위에 떠올랐다가 태블릿 안으로 빨려 들어간다
(function(){ const c=cutById.C09; if(!c) return; const E=[["AI 중점학교",250,170],["미래형 과학실",1330,150],["AI·디지털 활용 교육",120,430],["국제교육협력사업",1400,400],["경기예술365+",560,90]]; const tx=1150,ty=600;
  E.forEach((e,i)=>{const el=document.createElement("div"); el.className="emb"; el.innerHTML="<i></i>"+e[0]; el.style.left=e[1]+"px"; el.style.top=e[2]+"px"; $("#fx").appendChild(el);
    const dx=tx-e[1]-150, dy=ty-e[2]-40, t0=c.start+.35+i*.3;
    A(el,[{opacity:0,transform:"translateY(30px) scale(.3)",offset:0},{opacity:1,transform:"translateY(0) scale(1.08)",offset:.6},{opacity:1,transform:"translateY(0) scale(1)",offset:1}],t0,.5);
    const f=el.animate([{opacity:1,transform:"translate(0,0) scale(1)"},{opacity:1,transform:`translate(${dx*.6}px,${dy*.6}px) scale(.6)`,offset:.6},{opacity:0,transform:`translate(${dx}px,${dy}px) scale(.08)`}],{duration:650,delay:(c.start+c.dur*.66+i*.11)*1000,fill:"forwards",easing:"cubic-bezier(.5,0,.8,.4)"}); f.pause(); anims.push(f); });
})();
// --- C-11 과목 키워드 스트림 (과목명은 임시 예시)
(function(){ const c=cutById.C11; if(!c) return; const K=[["인공지능 기초","심화 수학","세계사","생명과학 실험","미디어 영어","경제","프로그래밍","물리학","심리학","음악 연주와 창작"],["데이터 과학","철학","국제 관계의 이해","화학","스포츠 생활","미술 창작","지구과학","정보","문학과 매체","기하"],["확률과 통계","영미 문학 읽기","정치와 법","로봇 공학","교육학","융합과학 탐구","일본어","중국어","사회문제 탐구","연극"]];
  [[150,50,-1,.8],[610,40,1,.7]].forEach((r,i)=>{const el=document.createElement("div"); el.className="kwrow"; el.style.top=r[0]+"px"; el.style.fontSize=r[1]+"px"; el.style.opacity=0; el.innerHTML=(K[i].concat(K[i])).map(w=>"<span>"+w+"</span>").join(""); $("#fx").appendChild(el);
    const from=r[2]<0?400:-2600, to=r[2]<0?-2600:400; A(el,[{transform:`translateX(${from}px)`},{transform:`translateX(${to}px)`}],c.start,c.dur,"linear");
    const o=el.animate([{opacity:0},{opacity:r[3],offset:.1},{opacity:r[3],offset:.9},{opacity:0}],{duration:c.dur*1000,delay:c.start*1000,fill:"both"}); o.pause(); anims.push(o); });
})();
// --- C-12 시설 라벨 (해바라기 배열 순서대로)
(function(){ const c=cutById.C12; if(!c) return; const L=[["체육관",960,560],["스터디 카페",1500,230],["컴퓨터실",1640,620],["과학실",1390,900],["도서실",520,900],["급식실",280,620],["운동장",420,230]];
  L.forEach((l,i)=>{const el=document.createElement("div"); el.className="lab"; el.textContent=l[0]; el.style.left=l[1]+"px"; el.style.top=(l[2]-90)+"px"; $("#fx").appendChild(el);
    const t0=c.start+c.dur*.36+i*(c.dur*.42/7);
    A(el,[{transform:"translate(-50%,-50%) scale(0)"},{transform:"translate(-50%,-50%) scale(1.15)",offset:.6},{transform:"translate(-50%,-50%) scale(1)"}],t0,.32);
    const o=el.animate([{opacity:1},{opacity:0}],{duration:150,delay:(c.end-.15)*1000,fill:"forwards"}); o.pause(); anims.push(o); });
})();
// --- C-34 로고 자리
(function(){ const c=cutById.C34; if(!c) return; const L=c.el.querySelector("#logo");
  A(L.querySelector(".n"),[{opacity:0,letterSpacing:".3em"},{opacity:1,letterSpacing:".08em"}],c.start+.5,1.3,"cubic-bezier(.2,.7,.2,1)");
  A(L.querySelector(".l"),[{width:"0px"},{width:"420px"}],c.start+1.0,1.0); A(L.querySelector(".p"),[{opacity:0},{opacity:1}],c.start+1.6,.8);
})();

// 화면 전체 효과: [시각, 길이, 최대 불투명도]
const FL=[[cutById.C03.start+.42,.5,.85],[cutById.C14.start+cutById.C14.dur*.53,.28,.5],[cutById.C26.start,.7,.9],[cutById.C31.start,.6,.6],[cutById.C24c.start,.3,.45]];
const WHITE_IN=cutById.C34.start; // 로고 컷 앞 화이트 디졸브

function layout(){ TL.cuts.forEach(c=>{ if(!c.im) return; const a=c.im.naturalWidth/c.im.naturalHeight; if(a>=W/H){c.bh=H;c.bw=H*a}else{c.bw=W;c.bh=W/a} c.im.style.width=c.bw+"px"; c.im.style.height=c.bh+"px"; }); }

window.seek=function(t){
  let cur=null;
  TL.cuts.forEach(c=>{
    const next=TL.cuts[c.i+1], fin=c.sp.tin&&c.sp.tin.fade||0, nfade=next&&next.sp.tin&&next.sp.tin.fade||0;
    const vis = t>=c.start && t<c.end+nfade;
    c.el.style.display=vis?"block":"none"; if(!vis) return;
    if(t<c.end) cur=c;
    c.el.style.opacity = fin? Math.min(1,(t-c.start)/fin) : 1;
    if(c.id==="C34") c.el.style.opacity=Math.min(1,(t-c.start+.5)/.5);
    if(!c.im) return;
    const sp=c.sp, p=(t-c.start)/c.dur, k=camAt(sp.k,Math.min(1.2,Math.max(0,p)));
    let s=k[1], fx=k[2], fy=k[3], r=k[4];
    if(sp.pulse){const d=t-lastBeat(t); s*=1+sp.pulse*Math.exp(-7*d);}
    if(sp.breathe){ s*=1+.012*Math.sin((t-c.start)*2*Math.PI/1.6); }
    const w=c.bw*s, h=c.bh*s; let x=W/2-fx*w, y=H/2-fy*h;
    if(sp.shake){ const m=sp.shake*(c.id==="C03"&&p>.17?.4:1); x+=m*(Math.sin(t*37.1)+.6*Math.sin(t*61.7+1)); y+=m*(Math.sin(t*43.3+2)+.6*Math.sin(t*71.9)); }
    x=Math.min(0,Math.max(W-w,x)); y=Math.min(0,Math.max(H-h,y));
    c.im.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(5)})`;
    c.rot.style.transform=r?`rotate(${r.toFixed(3)}deg) scale(${(1+Math.abs(r)*.03).toFixed(4)})`:"";
    if(sp.rack){ const b=Math.max(0,1-p/.55)*9; c.im.style.filter=b>.05?`blur(${b.toFixed(2)}px)`:"none"; }
  });
  // C-34 직전 0.5초부터 화이트로 넘어간다
  const c34=cutById.C34; if(t>=c34.start-.5 && t<c34.start){ c34.el.style.display="block"; c34.el.style.opacity=(t-(c34.start-.5))/.5; }
  let f=0; FL.forEach(([t0,d,pk])=>{ if(t>=t0&&t<t0+d){ const u=(t-t0)/d; f=Math.max(f,pk*(u<.12?u/.12:1-(u-.12)/.88)); } });
  $("#flash").style.opacity=f;
  $("#dark").style.opacity = cur&&cur.sp.dark? cur.sp.dark : (t<1.2? 0 : 0);
  const end=TL.total; $("#dark").style.opacity = Math.max(parseFloat($("#dark").style.opacity)||0, t>end-.6? (t-(end-.6))/.6 : 0);
  $("#grad").style.opacity = (cur&&cur.id==="C34")?0:1;
  if(cur){ const tg=$("#tag"); tg.style.display=SHOW_TAG?"flex":"none"; tg.className=cur.id==="C34"?"light":"";
    tg.innerHTML=`<span>SCENE ${cur.scene} · ${SCENES[cur.scene]}</span><span class="c">${cur.sp.label||cur.id.replace("C","C-")}</span><span>${cur.sp.shot}</span>`; }
  anims.forEach(a=>{a.currentTime=t*1000;});
};
window.ready=Promise.all(imgs.map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve())).then(()=>document.fonts.ready).then(()=>{layout();window.seek(0);return true;});
</script>
</body>
</html>
